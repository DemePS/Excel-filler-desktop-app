# The downloadable Windows app on Azure Pipelines: build, test, sign and publish it.
#
# - Every push to api-management: tests, the Windows build, its self-test and a start of the real
#   window; the zip is published as the pipeline artifact "ExcelFiller-<version>-windows".
# - A tag v<version> (e.g. v0.1.0, the version in pyproject.toml): the same, and the build must be
#   signed. Distribute that zip (Intune, a file share, ...).
#
# Setup (once, in the Azure DevOps project):
# 1. Pipelines > Library > Variable group "excel-filler" (none of these is a secret):
#      EXCEL_FILLER_GATEWAY    https://<apim>.azure-api.net/excel-filler
#      EXCEL_FILLER_API_SCOPE  api://<gateway API app id>/.default
#      EXCEL_FILLER_CLIENT_ID  the desktop app registration's application (client) ID
#      EXCEL_FILLER_TENANT_ID  the organization's tenant ID
#    Without them the build is a developer build (no access check, Foundry called directly).
#    For code signing (Azure Trusted Signing; see docs/code-signing.md), also:
#      SIGNING_ENDPOINT        https://<region>.codesigning.azure.net/
#      SIGNING_ACCOUNT         the Trusted Signing account name
#      SIGNING_PROFILE         its certificate profile name
#    Optional: ALLOW_UNSIGNED_RELEASE = true to allow an unsigned tagged build (e.g. a pilot).
# 2. For signing: an Azure Resource Manager service connection (workload identity federation, no
#    secret) named "excel-filler-signing", whose identity has the role "Trusted Signing Certificate
#    Profile Signer" on the certificate profile; then set the pipeline parameter "sign" to true
#    (its default below), or run with it.
# 3. The agent engine (codeagent-apim) is installed as pinned in uv.lock, from the source named in
#    [tool.uv.sources] (pyproject.toml). To take it from the organization's Azure Artifacts feed:
#    publish codeagent-apim there, point [tool.uv.sources] at the feed, run `uv lock`, and
#    authorize this pipeline on the feed.

trigger:
  branches:
    include: [api-management]
  tags:
    include: ["v*"]

pr: none

parameters:
  - name: sign
    displayName: Sign the app (needs the excel-filler-signing service connection)
    type: boolean
    default: false

variables:
  - group: excel-filler
  - name: isTag
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}

pool:
  vmImage: windows-latest

jobs:
  - job: build
    displayName: Build, test and package
    timeoutInMinutes: 30
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        displayName: Python 3.12
        inputs:
          versionSpec: "3.12"

      - pwsh: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv sync --locked --group build --python 3.12
        displayName: The pinned dependencies

      - pwsh: uv run --python 3.12 pytest -q
        displayName: Tests

      - pwsh: |
          $version = (uv run --python 3.12 python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ("$(isTag)" -eq "True" -and "$(Build.SourceBranchName)" -ne "v$version") {
            Write-Error "The tag $(Build.SourceBranchName) does not match the version in pyproject.toml ($version)."
            exit 1
          }
          Write-Host "##vso[task.setvariable variable=version]$version"
          Write-Host "##vso[build.updatebuildnumber]$version-$(Build.BuildId)"
        displayName: Version

      - pwsh: |
          # A variable missing from the group stays as the literal text "$(NAME)": treat it as empty.
          foreach ($name in "GATEWAY", "API_SCOPE", "CLIENT_ID", "TENANT_ID") {
            if ((Get-Item "env:$name" -ErrorAction SilentlyContinue).Value -like '$(*') { Set-Item "env:$name" "" }
          }
          $settings = [ordered]@{
            _comment  = "The organization's settings, built into this app by the release build."
            gateway   = "$env:GATEWAY"
            api_scope = "$env:API_SCOPE"
            client_id = "$env:CLIENT_ID"
            tenant_id = "$env:TENANT_ID"
          }
          $settings | ConvertTo-Json | Set-Content -Encoding utf8 excel_filler/organization.json
          if ($env:CLIENT_ID) { "Organization build: gateway $env:GATEWAY" } else { "Developer build (no organization settings)" }
        displayName: Organization settings
        env:
          GATEWAY: $(EXCEL_FILLER_GATEWAY)
          API_SCOPE: $(EXCEL_FILLER_API_SCOPE)
          CLIENT_ID: $(EXCEL_FILLER_CLIENT_ID)
          TENANT_ID: $(EXCEL_FILLER_TENANT_ID)

      - pwsh: uv run --python 3.12 --group build pyinstaller --noconfirm --distpath dist --workpath build packaging/excel-filler.spec
        displayName: Build ExcelFiller.exe

      - ${{ if eq(parameters.sign, true) }}:
          - task: AzureCLI@2
            displayName: Sign ExcelFiller.exe (Azure Trusted Signing)
            inputs:
              azureSubscription: excel-filler-signing
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                Install-Module -Name TrustedSigning -Scope CurrentUser -Force -AllowClobber
                # Signs in with this task's Azure CLI session (the service connection): no secret.
                Invoke-TrustedSigning -Endpoint "$(SIGNING_ENDPOINT)" `
                  -CodeSigningAccountName "$(SIGNING_ACCOUNT)" -CertificateProfileName "$(SIGNING_PROFILE)" `
                  -FilesFolder dist\ExcelFiller -FilesFolderFilter exe -FileDigest SHA256 `
                  -TimestampRfc3161 http://timestamp.acs.microsoft.com -TimestampDigest SHA256

      - pwsh: |
          $signature = Get-AuthenticodeSignature dist\ExcelFiller\ExcelFiller.exe
          "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          $signed = $signature.Status -eq "Valid"
          if ("${{ parameters.sign }}" -eq "True" -and -not $signed) {
            Write-Error "Signing is configured but ExcelFiller.exe is not validly signed ($($signature.Status))."; exit 1
          }
          if (-not $signed) {
            Write-Host "##vso[task.logissue type=warning]Unsigned build: Windows SmartScreen will warn when a downloaded copy is started. See docs/code-signing.md."
            if ("$(isTag)" -eq "True" -and "$env:ALLOW_UNSIGNED" -ne "true") {
              Write-Error "A release (tag) must be signed (or set ALLOW_UNSIGNED_RELEASE to true in the variable group)."; exit 1
            }
          }
        displayName: Signature
        env:
          ALLOW_UNSIGNED: $(ALLOW_UNSIGNED_RELEASE)

      - pwsh: |
          $log = Join-Path $env:USERPROFILE ".coding-agent\logs\excel-filler-desktop.log"
          $p = Start-Process -FilePath dist\ExcelFiller\ExcelFiller.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $log -Tail 20
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit code $($p.ExitCode))"; exit 1 }
        displayName: Self-test of the built app

      - pwsh: |
          $log = Join-Path $env:USERPROFILE ".coding-agent\logs\excel-filler-desktop.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\ExcelFiller\ExcelFiller.exe -PassThru
          Start-Sleep -Seconds 25
          $text = Get-Content $log -Raw
          Get-Content $log -Tail 25
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($text -notmatch "Backend ready") { Write-Error "The backend did not start"; exit 1 }
          if ($text -match "native window could not open") { Write-Error "The native window did not open"; exit 1 }
          if ($text -match "Unexpected error") { Write-Error "An unexpected error was logged"; exit 1 }
        displayName: The real window starts (WebView2)

      - pwsh: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\ExcelFiller -DestinationPath "out\ExcelFiller-$(version)-windows.zip"
        displayName: Zip

      - task: PublishPipelineArtifact@1
        displayName: Publish the zip
        inputs:
          targetPath: out
          artifact: ExcelFiller-$(version)-windows
