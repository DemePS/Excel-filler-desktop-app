[project]
name = "excel-filler-desktop-app"
version = "0.1.0"
description = "Fill Excel workbooks from PDF documents with Claude (Azure / Microsoft Foundry), reviewing every change"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The agent engine: loop, tools, safety rules, memory. Pinned to a commit of the coding agent;
    # update the ref to take a newer version (see README).
    "coding-agent @ git+https://github.com/DemePS/weather.git@df5d47b",
]

[project.scripts]
excel-filler = "excel_filler.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the git dependency above

[tool.hatch.build.targets.wheel]
packages = ["excel_filler"]
