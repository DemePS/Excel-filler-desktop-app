[project]
name = "excel-filler-desktop-app"
version = "0.1.0"
description = "Fill Excel workbooks from PDF documents with Claude (Azure / Microsoft Foundry), reviewing every change"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Exact versions: the ones tested together (uv.lock pins their own dependencies too). To
    # upgrade, change a version here, run `uv lock`, and run the tests (see README).
    # The agent engine: loop, tools, safety rules, memory -- a commit of the coding agent.
    "codeagent @ git+https://github.com/DemePS/CodeAgent.git@c2fd0bee2c6ff77863db1c3984175a997a2ae484",
    "fastapi==0.141.1",   # the desktop window's local backend
    "uvicorn==0.54.0",
    "websockets==16.1.1", # uvicorn's WebSocket support (the window's live events)
    "keyring>=25",        # saves the API key in the Windows Credential Manager
    "pywebview==6.2.1",   # the native window (WebView2 on Windows, WebKit on macOS)
]

[project.scripts]
comptaia = "excel_filler.cli:main"
excel-filler = "excel_filler.cli:main"  # the former name, kept so scripts keep working
# A console command for now, so errors are visible (they also go to the log file). The Windows
# installer will start the window without a console.
comptaia-desktop = "excel_filler.desktop.app:main"
excel-filler-desktop = "excel_filler.desktop.app:main"  # the former name

[dependency-groups]
dev = ["pytest==9.1.1"]
# The downloadable app (packaging/comptaia.spec): `uv run --group build pyinstaller packaging/comptaia.spec`
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.7"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the git dependency above

[tool.hatch.build.targets.wheel]
packages = ["excel_filler"]
# The React UI is built into excel_filler/desktop/static (npm run build in frontend/).
artifacts = ["excel_filler/desktop/static/**"]
