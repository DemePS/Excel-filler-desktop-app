[project]
name = "excel-filler-desktop-app"
version = "0.1.0"
description = "Fill Excel workbooks from PDF documents with Claude (Azure / Microsoft Foundry), reviewing every change"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The agent engine: loop, tools, safety rules, memory. Pinned to a commit of the coding agent;
    # update the ref to take a newer version (see README).
    "coding-agent @ git+https://github.com/DemePS/weather.git@8bd5de7",
    "fastapi>=0.141.1",   # the desktop window's local backend
    "uvicorn>=0.30",
    "websockets>=13",     # uvicorn's WebSocket support (the window's live events)
    "pywebview>=5",       # the native window (WebView2 on Windows, WebKit on macOS)
]

[project.scripts]
excel-filler = "excel_filler.cli:main"
# A console command for now, so errors are visible (they also go to the log file). The Windows
# installer will start the window without a console.
excel-filler-desktop = "excel_filler.desktop.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the git dependency above

[tool.hatch.build.targets.wheel]
packages = ["excel_filler"]
# The React UI is built into excel_filler/desktop/static (npm run build in frontend/).
artifacts = ["excel_filler/desktop/static/**"]
