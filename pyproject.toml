[project]
name = "excel-filler-desktop-app"
version = "0.1.0"
description = "Fill Excel workbooks from PDF documents with Claude (Azure / Microsoft Foundry), reviewing every change"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Exact versions: the ones tested together (uv.lock pins their own dependencies too). To
    # upgrade, change a version here, run `uv lock`, and run the tests (see README).
    # The agent engine (loop, tools, safety rules, memory, gateway sign-in): the codeagent-apim
    # package. Until it is on PyPI, uv takes it from GitHub ([tool.uv.sources] below).
    "codeagent-apim==0.5.0",
    "fastapi==0.141.1",   # the desktop window's local backend
    "uvicorn==0.54.0",
    "websockets==16.1.1", # uvicorn's WebSocket support (the window's live events)
    "pywebview==6.2.1",   # the native window (WebView2 on Windows, WebKit on macOS)
]

[project.scripts]
excel-filler = "excel_filler.cli:main"
# A console command for now, so errors are visible (they also go to the log file). The Windows
# installer will start the window without a console.
excel-filler-desktop = "excel_filler.desktop.app:main"

[dependency-groups]
dev = ["pytest==9.1.1"]
# The downloadable app (packaging/excel-filler.spec): `uv run --group build pyinstaller packaging/excel-filler.spec`
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.7"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv.sources]
# codeagent-apim 0.5.0 is not on PyPI yet: this commit of the CodeAgent repository (its
# api-management branch). Once published, delete this section and run `uv lock`.
codeagent-apim = { git = "https://github.com/DemePS/CodeAgent.git", rev = "74ad826167bdd2a9dccb79eb7e1ac9176bf79707" }

[tool.hatch.build.targets.wheel]
packages = ["excel_filler"]
# The React UI is built into excel_filler/desktop/static (npm run build in frontend/).
artifacts = ["excel_filler/desktop/static/**"]
